name: sync
on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: sync, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          set -e
          python3 tools/sync.py
          python3 tools/estate.py
          python3 brainify.py . rapp-specs --dogg --include specs,estate
          python3 tools/verify_thread.py
          git config user.name "rapp-specs"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "sync: $(date -u +%F)"; git push; }
